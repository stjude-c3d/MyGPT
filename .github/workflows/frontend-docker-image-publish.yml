name: Frontend Docker Image on publish

on:
  release:
    types: [published]
  workflow_dispatch:
 

jobs:
 build:
  runs-on: ubuntu-latest
  permissions:
   contents: read
   packages: write

  steps:
   - name: Checkout code
     uses: actions/checkout@v3

   - name: Log	in to GitHub Container Registry
     run: echo ${{ secrets.GITHUB_TOKEN }} | docker	login ghcr.io -u ${{ github.actor }} --password-stdin

  # build for arm64 and amd64
   - name: Set up QEMU
     uses: docker/setup-qemu-action@v3

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3

   - name: Get release tag
     id: get_tag
     run: |
      VERSION="${{ github.ref_name }}"
      VERSION=$(echo "$VERSION" | sed -e 's/^v//')  # Remove 'v' prefix if present
      echo "Version: $VERSION"
      echo "version=$VERSION" >> $GITHUB_OUTPUT

   - name: Build and push
     uses: docker/build-push-action@v5
     with:
      context: frontend
      file: frontend/Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
       ghcr.io/stjude/mygpt-frontend:latest
       ghcr.io/stjude/mygpt-frontend:${{ steps.get_tag.outputs.version }}